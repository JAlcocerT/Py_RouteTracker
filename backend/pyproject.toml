[project]
name = "routetracker-backend"
version = "0.1.0"
description = "Static-file server for the Py_RouteTracker frontend -- every compute-heavy feature runs client-side, see frontend/src/lib/"
readme = "readme.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "httpx>=0.27",  # required by starlette's TestClient
]

[tool.pytest.ini_options]
testpaths = ["tests"]
